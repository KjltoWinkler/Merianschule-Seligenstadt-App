name: Build & Release App Update

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (z. B. v1.0.6)'
        required: false
        default: ''
      release_notes:
        description: 'Release Notes (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Determine Version & Build Information
        id: versioning
        run: |
          # 1. Ermitteln des Release-Tags
          TAG_NAME="${{ github.event.release.tag_name }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          fi
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          fi

          # Entferne führendes 'v' falls vorhanden (z. B. v1.0.6 -> 1.0.6)
          CLEAN_VERSION="${TAG_NAME#v}"
          if [ -z "$CLEAN_VERSION" ]; then
            CLEAN_VERSION="1.0.0"
          fi

          # 2. Ermitteln des höchsten VersionCodes (Server vs. Lokales build.gradle.kts)
          # Damit wird ein Downgrade-Fehler auf Android-Geräten zuverlässig verhindert.
          SERVER_CODE=$(curl -s --max-time 10 "https://api.veloschulplaner.de/api/app/version" | grep -oE '"versionCode"\s*:\s*[0-9]+' | head -n1 | grep -oE '[0-9]+' || echo "0")
          if [ -z "$SERVER_CODE" ]; then SERVER_CODE=0; fi

          LOCAL_CODE=$(grep -E 'versionCode\s*=' androidApp/build.gradle.kts | head -n1 | grep -oE '[0-9]+' | tail -n1 || echo "1")
          if [ -z "$LOCAL_CODE" ]; then LOCAL_CODE=1; fi

          if [ "$SERVER_CODE" -ge "$LOCAL_CODE" ]; then
            NEW_CODE=$((SERVER_CODE + 1))
          else
            NEW_CODE=$LOCAL_CODE
          fi

          # 3. Release Notes ermitteln
          NOTES="${{ github.event.release.body }}"
          if [ -z "$NOTES" ]; then
            NOTES="${{ github.event.inputs.release_notes }}"
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Update auf Version $CLEAN_VERSION (Build $NEW_CODE)"
          fi

          echo "VERSION_NAME=$CLEAN_VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$NEW_CODE" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          
          # Sichere Übergabe der Release Notes (auch mit Zeilenumbrüchen)
          {
            echo "RELEASE_NOTES<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_ENV

          echo "🚀 Release Vorbereitung:"
          echo "   • Tag: $TAG_NAME"
          echo "   • VersionName: $CLEAN_VERSION"
          echo "   • VersionCode: $NEW_CODE (Server hatte: $SERVER_CODE, Local: $LOCAL_CODE)"

      - name: Build Android Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleRelease \
            -PappVersionCode="${{ env.VERSION_CODE }}" \
            -PappVersionName="${{ env.VERSION_NAME }}" \
            --no-daemon

      - name: Locate & Rename APK
        run: |
          APK_FILE="androidApp/build/outputs/apk/release/androidApp-release.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "❌ APK wurde nicht unter $APK_FILE gefunden!"
            exit 1
          fi

          FINAL_APK_NAME="MerianschuleApp-v${{ env.VERSION_NAME }}.apk"
          cp "$APK_FILE" "$FINAL_APK_NAME"
          echo "APK_PATH=$FINAL_APK_NAME" >> $GITHUB_ENV
          echo "✅ APK erstellt: $FINAL_APK_NAME ($(du -h "$FINAL_APK_NAME" | cut -f1))"

      - name: Upload APK to GitHub Release Assets
        if: env.TAG_NAME != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Lade APK in GitHub Release hoch..."
          # Falls der Release-Asset bereits existiert, überschreiben mit --clobber
          gh release upload "${{ env.TAG_NAME }}" "${{ env.APK_PATH }}" --clobber || {
            echo "⚠️ Konnte Release Asset nicht direkt hochladen (Release möglicherweise noch im Entwurf)."
          }

      - name: Sync APK & Release Info with Backend Server
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_SECRET_KEY || 'merian-admin-secret-2026' }}
        run: |
          echo "Pushe Update an Server https://api.veloschulplaner.de..."
          
          RESPONSE=$(curl -s -S -X POST "https://api.veloschulplaner.de/api/admin/app/upload-apk" \
            -H "X-Admin-Key: $ADMIN_KEY" \
            -F "apk=@${{ env.APK_PATH }}" \
            -F "releaseNotes=${{ env.RELEASE_NOTES }}")
          
          echo "Server Antwort: $RESPONSE"
          
          # Prüfen ob Antwort Erfolg signalisiert ("success": true / "success":true)
          if echo "$RESPONSE" | grep -qE '"success"[[:space:]]*:[[:space:]]*true'; then
            echo "🎉 Update v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }}) erfolgreich auf dem Server aktiviert!"
          else
            echo "❌ Fehler beim Hochladen auf den Server!"
            exit 1
          fi

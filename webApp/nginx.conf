server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    default_type application/octet-stream;

    # Gzip compression for fast loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/javascript
        application/xml
        application/json
        application/wasm
        image/svg+xml;

    # Cache content-hashed assets forever (wasm, web fonts)
    location ~* \.(?:wasm|woff2?|eot|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static assets (images, icons) - short cache
    location ~* \.(?:ico|css|gif|jpe?g|png|svg)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # NEVER cache entry scripts, HTML or manifest
    location ~* (?:index\.html|webApp\.js|manifest\.json)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    # SPA fallback: redirect all unknown paths to index.html with no-cache
    location / {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}

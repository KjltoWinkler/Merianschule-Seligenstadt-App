services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: merianschule-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      - DB_PATH=/app/data/merianschule.db
      - ADMIN_SECRET_KEY=merian-admin-secret-2026
      - JWT_SECRET=merianschule-seligenstadt-secret-key-2026-safe-production
      - ADMIN_DEFAULT_PASSWORD=MerianAdmin2026!
    volumes:
      - merianschule_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  merianschule_data:
